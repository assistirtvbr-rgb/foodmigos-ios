name: Build FoodMigos iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Install CocoaPods Dependencies
        run: |
          cd src
          pod install --repo-update || (sleep 5 && pod install --repo-update) || (sleep 10 && pod install)

      - name: Build Xcode Project for iOS Device
        run: |
          cd src
          xcodebuild -workspace FoodMigos.xcworkspace \
            -scheme FoodMigos \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .IPA
        run: |
          cd src
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/FoodMigos.app Payload/
          zip -r FoodMigos.ipa Payload
          mkdir -p ../dist
          mv FoodMigos.ipa ../dist/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodMigos-iOS-IPA
          path: dist/FoodMigos.ipa
          retention-days: 14
